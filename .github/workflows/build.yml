name: Build AXIOM

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and test (Minecraft 1.21.11)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Locate project (root folder or uploaded ZIP)
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build.gradle ]]; then
            PROJECT_DIR="."
          elif [[ -f axiom-2.0.0-repaired-github-build.zip ]]; then
            mkdir -p axiom-source
            unzip -q axiom-2.0.0-repaired-github-build.zip -d axiom-source
            PROJECT_DIR="axiom-source"
          else
            echo "::error::No build.gradle or AXIOM source ZIP found at repository root."
            exit 1
          fi
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/src/main/resources/fabric.mod.json"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean test build

      - name: Upload compiled mod JAR
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: axiom-2.0.0-minecraft-1.21.11
          path: ${{ steps.project.outputs.project_dir }}/build/libs/axiom-2.0.0.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-test-reports
          path: ${{ steps.project.outputs.project_dir }}/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

